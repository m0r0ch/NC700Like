name: NC700Like
options:
  bundleIdPrefix: jp.nc700like
  deploymentTarget:
    iOS: "17.0"
packages:
  NC700LikeKit:
    path: NC700LikeKit
targets:
  NC700Like:
    type: application
    platform: iOS
    sources:
      - path: NC700Like
        excludes:
          - "BLEScanMin/**"
    dependencies:
      - package: NC700LikeKit
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: NC700Like/Info.plist
      properties:
        CFBundleDisplayName: NC700Like
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Bose NC700 のアシスタントボタンの押下を検出するためにBluetoothを使用します。
        CFBundleURLTypes:
          - CFBundleURLName: nc700like
            CFBundleURLSchemes:
              - nc700like
        UIBackgroundModes:
          - bluetooth-central
  BLEScanMin:
    type: application
    platform: iOS
    sources:
      - NC700Like/BLEScanMin
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: jp.nc700like.scanmin
    info:
      path: NC700Like/BLEScanMin/Info.plist
      properties:
        CFBundleDisplayName: BLEScanMin
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: BLE スキャン(広告受信)だけを確認するための最小アプリです。
schemes:
  NC700Like:
    build:
      targets:
        NC700Like: all
    run:
      config: Debug
  BLEScanMin:
    build:
      targets:
        BLEScanMin: all
    run:
      config: Debug
