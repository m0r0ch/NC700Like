name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (NC700LikeKit)
        run: swift test
        working-directory: NC700LikeKit

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project NC700Like.xcodeproj -scheme NC700Like \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            | tee xcodebuild.log | tail -50

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NC700Like.app Payload/
          zip -r NC700Like.ipa Payload
      - name: Show bundle summary
        run: |
          ls -la build/Build/Products/Release-iphoneos/NC700Like.app
          unzip -l NC700Like.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: NC700Like-ipa
          path: NC700Like.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
